<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8e7a2" />
      <stop offset="50%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#785507" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#b8c6db" />
      <stop offset="70%" stop-color="#4e5d6c" />
      <stop offset="100%" stop-color="#1e252d" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="50%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 4" opacity="0.7"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.9"/>
  <circle cx="250" cy="250" r="208" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Crossed Valyrian Swords Behind Shield -->
  <g id="crossed-swords" stroke="url(#steelGrad)" stroke-width="2">
    <!-- Sword 1 (Top-Left to Bottom-Right) -->
    <line x1="80" y1="80" x2="420" y2="420" stroke="url(#steelGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="80" y1="80" x2="420" y2="420" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="125" y1="85" x2="85" y2="125" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="70" cy="70" r="10" fill="url(#goldGrad)"/>

    <!-- Sword 2 (Top-Right to Bottom-Left) -->
    <line x1="420" y1="80" x2="80" y2="420" stroke="url(#steelGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="420" y1="80" x2="80" y2="420" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="375" y1="85" x2="415" y2="125" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="430" cy="70" r="10" fill="url(#goldGrad)"/>
  </g>

  <!-- Medieval Shield Base -->
  <path d="M 130 140 
           Q 250 120 370 140 
           C 370 280 330 360 250 420 
           C 170 360 130 280 130 140 Z" 
        fill="url(#shieldBg)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#glow)"/>
  
  <path d="M 145 152 
           Q 250 135 355 152 
           C 355 275 320 345 250 402 
           C 180 345 145 275 145 152 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.8"/>

  <!-- Direwolf / Dragon Stylized Crest -->
  <g transform="translate(250, 240) scale(0.9)" fill="url(#goldGrad)">
    <!-- Crown -->
    <path d="M -40 -70 L -25 -45 L 0 -75 L 25 -45 L 40 -70 L 30 -35 L -30 -35 Z" />
    <circle cx="0" cy="-80" r="4" fill="#ff4d4d"/>
    <circle cx="-42" cy="-75" r="3" fill="#ff4d4d"/>
    <circle cx="42" cy="-75" r="3" fill="#ff4d4d"/>
    
    <!-- Beast Head Profile -->
    <path d="M 0 -30 
             C -25 -30 -45 -10 -45 20 
             C -45 50 -20 75 0 85 
             C 20 75 45 50 45 20 
             C 45 -10 25 -30 0 -30 Z" 
          fill="#11151c" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Eyes -->
    <circle cx="-14" cy="15" r="4" fill="#00e5ff" filter="url(#glow)"/>
    <circle cx="14" cy="15" r="4" fill="#00e5ff" filter="url(#glow)"/>
    <!-- Snout & Fangs -->
    <path d="M -12 35 L 0 50 L 12 35 Z" fill="url(#goldGrad)"/>
    <path d="M -6 45 L 0 62 L 6 45 Z" fill="#ffffff"/>
    
    <!-- Letter J Emblem in Rune Style -->
    <path d="M 8 -15 L 8 10 C 8 22 -6 22 -8 15" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Banner Ribbon at Bottom -->
  <g transform="translate(0, 390)">
    <path d="M 80 30 L 140 10 L 360 10 L 420 30 L 390 55 L 360 38 L 140 38 L 110 55 Z" 
          fill="#141821" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="250" y="28" font-family="'Cinzel', serif" font-size="16" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
      HOUSE JAYDEV
    </text>
    <text x="250" y="50" font-family="'Cinzel', serif" font-size="10" font-weight="600" fill="#a0aec0" text-anchor="middle" letter-spacing="3">
      JECRC • FIRST OF HIS NAME
    </text>
  </g>
</svg>
