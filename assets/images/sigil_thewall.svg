<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Pure Snow White Gradients -->
    <linearGradient id="snowWhiteGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0f9ff" />
      <stop offset="75%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <linearGradient id="iceAzureGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="wallDeepVoid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1e38" />
      <stop offset="45%" stop-color="#030c1a" />
      <stop offset="100%" stop-color="#01040a" />
    </linearGradient>

    <filter id="pureSnowGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="dragonBreathBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#01040a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Runic Ring of The Wall -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="url(#snowWhiteGleam)" stroke-width="4" stroke-dasharray="10 5" opacity="0.9"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#iceAzureGlow)" stroke-width="2.5" opacity="0.95"/>
  <circle cx="250" cy="250" r="206" fill="none" stroke="url(#snowWhiteGleam)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.75"/>

  <!-- Ancient Ice Shield of The Wall -->
  <path d="M 125 135 Q 250 110 375 135 C 375 285 335 375 250 435 C 165 375 125 285 125 135 Z" 
        fill="url(#wallDeepVoid)" stroke="url(#snowWhiteGleam)" stroke-width="6" filter="url(#pureSnowGlow)"/>
  <path d="M 142 148 Q 250 126 358 148 C 358 278 322 356 250 414 C 178 356 142 278 142 148 Z" 
        fill="none" stroke="url(#iceAzureGlow)" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.85"/>

  <!-- The 700-Foot Ice Wall Silhouette -->
  <path d="M 148 245 L 205 245 L 205 228 L 225 228 L 225 245 L 275 245 L 275 228 L 295 228 L 295 245 L 352 245 L 352 305 Q 250 340 148 305 Z" 
        fill="#08182b" opacity="0.85"/>

  <!-- Dragonfire Blast Flare on The Wall -->
  <ellipse cx="215" cy="245" rx="55" ry="35" fill="url(#dragonBreathBloom)" />

  <!-- Ice Dragon & Dragonflame Crest -->
  <g transform="translate(250, 255)">
    <!-- Dragon Horns / Crown -->
    <path d="M 0 -115 L 12 -80 L 35 -105 L 22 -65 L 48 -70 L 22 -45 L 0 -55 L -22 -45 L -48 -70 L -22 -65 L -35 -105 L -12 -80 Z"
          fill="url(#snowWhiteGleam)" filter="url(#pureSnowGlow)"/>
    
    <!-- Dragon Head & Jaws Exhaling Left -->
    <path d="M 18 -55 C 35 -35 45 -10 38 25 C 22 20 5 15 -10 12 C -25 10 -50 8 -80 0 C -55 -15 -35 -25 -15 -38 Z"
          fill="url(#iceAzureGlow)"/>

    <!-- Living Dragonfire Beam Erupting to the Left into the Wall -->
    <path d="M -80 0 Q -110 -8 -150 -12 Q -110 15 -80 12 Z"
          fill="url(#snowWhiteGleam)" filter="url(#pureSnowGlow)"/>

    <!-- Piercing Blue/White Dragon Eye -->
    <circle cx="12" cy="-22" r="5" fill="#ffffff" filter="url(#pureSnowGlow)"/>
    <circle cx="12" cy="-22" r="2.5" fill="#0284c7"/>

    <!-- Frost Claws & Ice Wing Tips -->
    <path d="M -45 55 Q 0 85 45 55 Q 15 110 0 135 Q -15 110 -45 55 Z"
          fill="url(#snowWhiteGleam)"/>
  </g>

  <!-- Rune Compass Stars -->
  <circle cx="250" cy="55" r="4" fill="#ffffff" filter="url(#pureSnowGlow)"/>
  <circle cx="250" cy="445" r="4" fill="#ffffff" filter="url(#pureSnowGlow)"/>
  <circle cx="55" cy="250" r="4" fill="#ffffff" filter="url(#pureSnowGlow)"/>
  <circle cx="445" cy="250" r="4" fill="#ffffff" filter="url(#pureSnowGlow)"/>
</svg>
