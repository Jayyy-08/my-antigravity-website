<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0aa" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="lanCrimson" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="50%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#1c0404" />
    </linearGradient>
    <filter id="lanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#lanGold)" stroke-width="4" stroke-dasharray="8 4" opacity="0.8"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#lanGold)" stroke-width="2" opacity="0.95"/>
  <circle cx="250" cy="250" r="208" fill="none" stroke="url(#lanGold)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Medieval Lannister Shield -->
  <path d="M 130 140 Q 250 120 370 140 C 370 280 330 360 250 420 C 170 360 130 280 130 140 Z" 
        fill="url(#lanCrimson)" stroke="url(#lanGold)" stroke-width="6" filter="url(#lanGlow)"/>
  <path d="M 145 152 Q 250 135 355 152 C 355 275 320 345 250 402 C 180 345 145 275 145 152 Z" 
        fill="none" stroke="url(#lanGold)" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.85"/>

  <!-- Golden Lion Rampant -->
  <g transform="translate(250, 260) scale(1.15)" fill="url(#lanGold)">
    <!-- Crown -->
    <path d="M -22 -95 L -30 -75 L -10 -82 L 0 -100 L 10 -82 L 30 -75 L 22 -95 Z" stroke="#fff" stroke-width="1"/>
    <!-- Lion Head & Roaring Jaws -->
    <path d="M -15 -80 C -35 -75 -42 -55 -38 -40 C -34 -25 -25 -20 -10 -22 C 0 -24 5 -30 2 -40 C -1 -50 -5 -60 -15 -80 Z"/>
    <path d="M -35 -50 C -50 -45 -55 -30 -42 -22 C -30 -15 -25 -25 -35 -50 Z"/>
    <path d="M -42 -35 L -28 -32 L -35 -24 Z" fill="#fff"/>
    <!-- Lion Mane Waves -->
    <path d="M -10 -75 C 15 -70 35 -50 32 -25 C 28 0 10 15 -5 10 C -20 5 -30 -10 -25 -30 C -20 -50 0 -65 -10 -75 Z" opacity="0.95"/>
    <path d="M 12 -60 C 28 -45 32 -20 20 -5 C 10 5 -5 0 -8 -15 C -10 -30 0 -50 12 -60 Z" fill="#fef08a"/>
    <!-- Forelegs / Raised Claws -->
    <path d="M -18 -20 C -35 -15 -55 -25 -65 -15 C -75 -5 -60 10 -45 5 C -30 0 -22 -10 -18 -20 Z"/>
    <path d="M -62 -18 L -72 -12 L -66 -6 Z" fill="#fff"/>
    <path d="M -10 5 C -25 15 -40 20 -48 35 C -55 48 -40 55 -28 45 C -18 35 -15 20 -10 5 Z"/>
    <path d="M -45 35 L -52 42 L -42 46 Z" fill="#fff"/>
    <!-- Muscular Body -->
    <path d="M -5 10 C 15 20 22 45 18 70 C 14 95 -5 110 -20 105 C -35 100 -30 75 -22 55 C -15 35 -18 20 -5 10 Z"/>
    <!-- Hind Legs & Claws -->
    <path d="M -15 85 C -25 98 -45 112 -40 128 C -35 140 -18 135 -10 122 C -5 110 -8 95 -15 85 Z"/>
    <path d="M -38 126 L -44 135 L -32 135 Z" fill="#fff"/>
    <path d="M 10 95 C 15 110 10 130 25 140 C 38 148 48 132 38 118 C 28 105 20 98 10 95 Z"/>
    <path d="M 28 138 L 32 148 L 42 140 Z" fill="#fff"/>
    <!-- Magnificent Tail -->
    <path d="M 16 75 C 35 70 55 50 60 25 C 65 0 52 -25 68 -45 C 80 -60 70 -75 58 -65 C 48 -55 52 -35 42 -20 C 35 -5 20 20 10 55 Z"/>
    <path d="M 68 -65 C 82 -75 92 -55 80 -45 C 70 -35 60 -50 68 -65 Z" fill="#fef08a"/>
  </g>
</svg>