<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tarRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="tarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="tarBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180a08" />
      <stop offset="50%" stop-color="#0c0504" />
      <stop offset="100%" stop-color="#050202" />
    </linearGradient>
    <filter id="tarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#tarGold)" stroke-width="4" stroke-dasharray="8 4" opacity="0.8"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#tarGold)" stroke-width="2" opacity="0.95"/>
  <circle cx="250" cy="250" r="208" fill="none" stroke="url(#tarRed)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Medieval Targaryen Shield -->
  <path d="M 130 140 Q 250 120 370 140 C 370 280 330 360 250 420 C 170 360 130 280 130 140 Z" 
        fill="url(#tarBlack)" stroke="url(#tarGold)" stroke-width="6" filter="url(#tarGlow)"/>
  <path d="M 145 152 Q 250 135 355 152 C 355 275 320 345 250 402 C 180 345 145 275 145 152 Z" 
        fill="none" stroke="url(#tarRed)" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.85"/>

  <!-- Three-Headed Red Dragon Crest -->
  <g transform="translate(250, 275) scale(1.1)" fill="url(#tarRed)">
    <!-- Dragon Fire Breaths -->
    <path d="M -55 -105 Q -75 -125 -65 -145 Q -50 -125 -45 -105 Z" fill="url(#tarGold)" opacity="0.9"/>
    <path d="M 0 -125 Q 0 -155 12 -165 Q 15 -145 5 -120 Z" fill="url(#tarGold)" opacity="0.95"/>
    <path d="M 55 -105 Q 75 -125 65 -145 Q 50 -125 45 -105 Z" fill="url(#tarGold)" opacity="0.9"/>

    <!-- Center Dragon Head & Neck -->
    <path d="M -15 -50 C -18 -80 -12 -110 0 -125 C 12 -110 18 -80 15 -50 Z"/>
    <path d="M -10 -115 L 0 -130 L 10 -115 L 18 -110 L 0 -95 L -18 -110 Z" fill="#ff8888"/>
    <!-- Left Dragon Head & Curved Neck -->
    <path d="M -12 -45 C -25 -65 -45 -85 -55 -105 C -45 -95 -30 -75 -15 -35 Z"/>
    <path d="M -60 -98 L -55 -112 L -45 -102 L -42 -95 L -52 -90 Z" fill="#ff8888"/>
    <!-- Right Dragon Head & Curved Neck -->
    <path d="M 12 -45 C 25 -65 45 -85 55 -105 C 45 -95 30 -75 15 -35 Z"/>
    <path d="M 60 -98 L 55 -112 L 45 -102 L 42 -95 L 52 -90 Z" fill="#ff8888"/>

    <!-- Massive Bat-Wings Outstretched -->
    <path d="M 0 -30 C -45 -70 -95 -95 -125 -80 C -115 -55 -85 -30 -65 -15 C -95 -15 -115 10 -105 35 C -85 25 -60 10 -40 5 C -20 0 -10 -15 0 -30 Z"/>
    <path d="M 0 -30 C 45 -70 95 -95 125 -80 C 115 -55 85 -30 65 -15 C 95 -15 115 10 105 35 C 85 25 60 10 40 5 C 20 0 10 -15 0 -30 Z"/>
    
    <!-- Dragon Core Body & Talons -->
    <path d="M -22 -35 C -28 0 -22 35 0 55 C 22 35 28 0 22 -35 Z"/>
    <path d="M -18 35 C -30 55 -42 75 -35 90 C -25 95 -15 75 -10 50 Z"/>
    <path d="M -38 88 L -44 98 L -32 96 Z" fill="url(#tarGold)"/>
    <path d="M 18 35 C 30 55 42 75 35 90 C 25 95 15 75 10 50 Z"/>
    <path d="M 38 88 L 44 98 L 32 96 Z" fill="url(#tarGold)"/>

    <!-- Serpentine Spiked Tail -->
    <path d="M 0 55 C -15 80 -10 115 10 135 C 25 150 15 165 0 160 C -15 155 -5 135 -2 120 C 2 105 -5 80 0 55 Z"/>
    <path d="M 0 155 L 12 170 L -10 165 Z" fill="url(#tarGold)"/>
  </g>
</svg>